<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="A precision luxury Chronometer and Digital Clock interface built with HTML5, CSS3, and Vanilla JavaScript. Features real-time analog sweeping hands, 12h/24h digital time, date, battery status, and radial numeral dial." />
  <meta name="theme-color" content="#000000" />
  <title>Digital & Analog Chronometer | Precision Real-Time Watch</title>

  <!-- Google Fonts: Playfair Display & Cinzel for Luxury Numerals, Inter for Complications -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
    rel="stylesheet" />

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="watch-wrapper" role="main">
    <div class="header-controls">
      <!-- 12H / 24H Format Toggle -->
      <div class="format-toggle-group">
        <span class="toggle-tag" id="tag12">12H</span>
        <button type="button" id="formatToggle" class="switch-btn" role="switch" aria-checked="false"
          aria-label="Toggle between 12-hour and 24-hour format" title="Toggle 12H / 24H format">
          <span class="switch-handle" aria-hidden="true"></span>
        </button>
        <span class="toggle-tag" id="tag24">24H</span>
      </div>
    </div>

    <!-- Watch Face Container -->
    <div class="watch-dial-container" id="watchDialContainer" aria-label="Analog and Digital Clock Face">
      <svg id="watchSvg" class="watch-svg" viewBox="0 0 500 500" aria-hidden="true">

        <!-- Luxury Gradient Definitions -->
        <defs>
          <!-- Rich 18K Yellow Gold Metallic Gradient for Numerals & Ticks -->
          <linearGradient id="dialGoldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fffde7" />
            <stop offset="25%" stop-color="#fff176" />
            <stop offset="60%" stop-color="#ffd54f" />
            <stop offset="85%" stop-color="#ffb300" />
            <stop offset="100%" stop-color="#ff8f00" />
          </linearGradient>

          <!-- Champagne Gold Metallic Gradient for Complications (Battery, Day, Date) -->
          <linearGradient id="complicationGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="35%" stop-color="#fffde7" />
            <stop offset="75%" stop-color="#ffecb3" />
            <stop offset="100%" stop-color="#ffd54f" />
          </linearGradient>

          <!-- Radiant Luminous Gold Gradient for Digital Clock Readout -->
          <linearGradient id="digitalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="30%" stop-color="#fff9c4" />
            <stop offset="65%" stop-color="#ffd54f" />
            <stop offset="90%" stop-color="#ffb300" />
            <stop offset="100%" stop-color="#ffa000" />
          </linearGradient>

          <!-- Subtle Glow Filter for Precision Contrast -->
          <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ffd54f" flood-opacity="0.55" />
          </filter>
        </defs>

        <!-- Dial Background -->
        <circle class="dial-background" cx="250" cy="250" r="248" />

        <!-- Master Center Group (origin at 250, 250) -->
        <g id="dialCenterGroup" transform="translate(250, 250)">

          <!-- Dial Ticks Group (60 minute & 12 major hour ticks) -->
          <g id="dialTicks" class="dial-ticks"></g>

          <!-- Hour Numbers 1 to 12 (Radially Rotated) -->
          <g id="dialNumbers" class="dial-numbers"></g>

          <!-- Complication: Top Battery Indicator -->
          <g class="complication-group battery-group">
            <text id="batteryText" class="complication-text battery-text" x="0" y="-95" text-anchor="middle">83%</text>
          </g>

          <!-- Complication: Left Day of Week -->
          <g class="complication-group day-group">
            <text id="dayText" class="complication-text day-text" x="-110" y="6" text-anchor="middle">SAT</text>
          </g>

          <!-- Complication: Right Day & Month -->
          <g class="complication-group date-group">
            <text id="dateText" class="complication-text date-text" x="110" y="6" text-anchor="middle">23 MAR</text>
          </g>

          <!-- Complication: Bottom Digital Time -->
          <g class="complication-group digital-group">
            <text id="digitalText" class="complication-text digital-text" x="0" y="115" text-anchor="middle">10:07
              PM</text>
          </g>

          <!-- Hands Group (Rotated around 0, 0) -->
          <!-- Hour Hand (Cream stem with bright red sleeve near pivot) -->
          <g id="hourHandGroup" class="hand-group">
            <line class="hour-hand-stem" x1="0" y1="0" x2="0" y2="-115" />
            <line class="hour-hand-accent" x1="0" y1="0" x2="0" y2="-28" />
          </g>

          <!-- Minute Hand (Cream stem reaching towards outer track) -->
          <g id="minuteHandGroup" class="hand-group">
            <line class="minute-hand-stem" x1="0" y1="0" x2="0" y2="-170" />
          </g>

          <!-- Second Hand (Vibrant Red Needle with Counter-Balance Tail) -->
          <g id="secondHandGroup" class="hand-group second-hand-group">
            <line class="second-hand-stem" x1="0" y1="42" x2="0" y2="-198" />
          </g>

          <!-- Center Pivot Hub Pin -->
          <circle class="center-hub-outer" cx="0" cy="0" r="7.5" />
          <circle class="center-hub-inner" cx="0" cy="0" r="2.2" />

        </g>
      </svg>
    </div>

    <!-- Secondary Controls & Meta Information -->
    <footer class="watch-meta" role="contentinfo">
      <div class="meta-pills">

        <button type="button" id="sweepToggle" class="meta-pill action-pill" title="Toggle hand motion style">
          <span class="motion-icon" aria-hidden="true">⏱</span>
          <span id="motionLabel">Smooth Sweep</span>
        </button>
      </div>
    </footer>

  </main>

  <!-- Core JavaScript -->
  <script src="script.js"></script>
</body>

</html>
